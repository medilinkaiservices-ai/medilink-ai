name: Firebase Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Choose what to deploy"
        required: true
        default: "hosting"
        type: choice
        options:
          - hosting
          - functions
          - all

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webapp/package-lock.json
            functions/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install webapp dependencies
        run: npm --prefix webapp ci

      - name: Install functions dependencies
        run: npm --prefix functions ci

      - name: Build webapp
        if: ${{ github.event.inputs.deploy_target == 'hosting' || github.event.inputs.deploy_target == 'all' }}
        run: npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate Firebase CLI
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_MEDILINK_AI_B3CF9: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MEDILINK_AI_B3CF9 }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_MEDILINK_AI_B3CF9" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy selected target
        shell: bash
        run: |
          case "${{ github.event.inputs.deploy_target }}" in
            hosting)
              firebase deploy --only hosting --project medilink-ai-b3cf9
              ;;
            functions)
              firebase deploy --only functions --project medilink-ai-b3cf9
              ;;
            all)
              firebase deploy --project medilink-ai-b3cf9
              ;;
            *)
              echo "Unknown deploy target"
              exit 1
              ;;
          esac
